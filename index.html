function escapeHtml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function genId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}

function nowTs() { return Date.now(); }

/** Logged time in Hong Kong, e.g. 27/10 14:05. Falls back to updatedAt for older rows. */
function formatLoggedAt(ts) {
    const n = typeof ts === 'number' && isFinite(ts) ? ts : NaN;
    if (!isFinite(n)) return '';
    const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Hong_Kong',
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
    }).formatToParts(new Date(n));
    const pick = type => {
        const p = parts.find(x => x.type === type);
        return p ? p.value : '';
    };
    return pick('day') + '/' + pick('month') + ' ' + pick('hour') + ':' + pick('minute');
}

function normalizeExpense(ex) {
    if (!ex || typeof ex !== 'object') return null;
    let splitUsers;
    if (Array.isArray(ex.splitUsers) && ex.splitUsers.length) {
        splitUsers = ex.splitUsers.filter(u => accMembers.includes(u));
    } else if (ex.splitUser === '全部' || !ex.splitUser) {
        splitUsers = [...accMembers];
    } else if (accMembers.includes(ex.splitUser)) {
        splitUsers = [ex.splitUser];
    } else {
        splitUsers = [...accMembers];
    }
    if (!splitUsers.length) splitUsers = [...accMembers];
    const updatedAt = typeof ex.updatedAt === 'number' ? ex.updatedAt : nowTs();
    const createdAt = typeof ex.createdAt === 'number' ? ex.createdAt : updatedAt;
    return {
        id: ex.id || genId(),
        desc: String(ex.desc || ''),
        payer: accMembers.includes(ex.payer) ? ex.payer : accMembers[0],
        splitUsers,
        currency: ex.currency === 'HKD' ? 'HKD' : 'JPY',
        amount: Number(ex.amount) || 0,
        createdAt,
        updatedAt,
        deleted: !!ex.deleted
    };
}

function migrateAccData(raw) {
    const data = raw && typeof raw === 'object' ? raw : {};
    const expenses = Array.isArray(data.expenses) ? data.expenses.map(normalizeExpense).filter(Boolean) : [];
    return {
        rate: typeof data.rate === 'number' && data.rate > 0 ? data.rate : 0.052,
        expenses,
        auditLogs: Array.isArray(data.auditLogs) ? data.auditLogs : [],
        updatedAt: typeof data.updatedAt === 'number' ? data.updatedAt : 0
    };
}

function mergeExpenses(localList, cloudList) {
    const map = new Map();
    [...(localList || []), ...(cloudList || [])].forEach(ex => {
        const n = normalizeExpense(ex);
        if (!n) return;
        const prev = map.get(n.id);
        if (!prev || (n.updatedAt || 0) >= (prev.updatedAt || 0)) map.set(n.id, n);
    });
    return Array.from(map.values()).sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
}

function mergeAccData(local, cloud) {
    const L = migrateAccData(local);
    const C = migrateAccData(cloud);
    return {
        rate: (C.updatedAt || 0) >= (L.updatedAt || 0) ? C.rate : L.rate,
        expenses: mergeExpenses(L.expenses, C.expenses),
        auditLogs: mergeAudit(L.auditLogs, C.auditLogs),
        updatedAt: Math.max(L.updatedAt || 0, C.updatedAt || 0, nowTs())
    };
}

function mergeAudit(a, b) {
    const key = x => (x.timestamp || '') + '|' + (x.action || '') + '|' + (x.details || '');
    const map = new Map();
    [...(a || []), ...(b || [])].forEach(x => { if (x) map.set(key(x), x); });
    return Array.from(map.values()).slice(0, 200);
}

function setSyncStatus(state) {
    syncState = state;
    const el = document.getElementById('sync-status');
    if (!el) return;
    if (!CLOUDFLARE_API_URL) {
        el.classList.add('hidden');
        el.textContent = '本地';
        return;
    }
    el.classList.remove('hidden');
    if (state === 'synced') { el.textContent = '雲端已同步'; el.className = 'text-[10px] bg-emerald-600 px-2 py-1 rounded-full shrink-0'; }
    else if (state === 'offline') { el.textContent = '離線'; el.className = 'text-[10px] bg-amber-600 px-2 py-1 rounded-full shrink-0'; }
    else if (state === 'syncing') { el.textContent = '同步中…'; el.className = 'text-[10px] bg-blue-700 px-2 py-1 rounded-full shrink-0'; }
    else { el.textContent = '本地'; el.className = 'text-[10px] bg-blue-800/80 px-2 py-1 rounded-full shrink-0'; }
}

async function softHash(str) {
    const enc = new TextEncoder().encode('okinawa-audit:' + str);
    if (crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    // fallback：極弱 hash（仍只係阻嚇）
    let h = 0;
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return 'fallback_' + Math.abs(h).toString(16);
}

async function loadAccData() {
    // local first
    let localRaw = localStorage.getItem(STORAGE_KEY);
    if (!localRaw) {
        const legacy = localStorage.getItem(STORAGE_KEY_LEGACY);
        if (legacy) {
            try {
                accData = migrateAccData(JSON.parse(legacy));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(accData));
            } catch (e) {
                accData = migrateAccData(null);
            }
        } else {
            accData = migrateAccData(null);
        }
    } else {
        try { accData = migrateAccData(JSON.parse(localRaw)); }
        catch (e) { accData = migrateAccData(null); }
    }

    if (!CLOUDFLARE_API_URL) {
        setSyncStatus('local');
        return;
    }

    setSyncStatus('syncing');
    try {
        const response = await fetch(CLOUDFLARE_API_URL);
        if (response.ok) {
            const cloudData = await response.json();
            accData = mergeAccData(accData, cloudData);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(accData));
            setSyncStatus('synced');
        } else {
            setSyncStatus('offline');
        }
    } catch (e) {
        console.warn('Cloudflare fetch failed', e);
        setSyncStatus('offline');
    }
}

async function saveAccData(logAction, logDetails, opts = {}) {
    if (!Array.isArray(accData.auditLogs)) accData.auditLogs = [];
    if (logAction) {
        accData.auditLogs.unshift({
            timestamp: new Date().toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' }),
            action: logAction,
            details: logDetails
        });
        if (accData.auditLogs.length > 200) accData.auditLogs.length = 200;
    }
    accData.updatedAt = nowTs();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(accData));

    if (CLOUDFLARE_API_URL) {
        setSyncStatus('syncing');
        try {
            // pull-merge-push to reduce overwrite risk
            let cloud = null;
            try {
                const r = await fetch(CLOUDFLARE_API_URL);
                if (r.ok) cloud = await r.json();
            } catch (_) {}
            if (cloud) accData = mergeAccData(accData, cloud);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(accData));
            await fetch(CLOUDFLARE_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(accData)
            });
            setSyncStatus('synced');
        } catch (e) {
            console.error('Failed to sync', e);
            setSyncStatus('offline');
        }
    } else {
        setSyncStatus('local');
    }

    if (!opts.skipRender && currentTab === 'ACCOUNTING') renderAccounting();
}

/** Display-only spiral offset so stacked identical coords stay visible. */
function displayLatLng(pt, dupIndex) {
    if (!dupIndex) return [pt.lat, pt.lng];
    const angle = dupIndex * 2.399963229728653; // golden angle
    const radius = 0.00028 * dupIndex; // ~30m steps
    const dLat = pt.lat + radius * Math.cos(angle);
    const cosLat = Math.cos(pt.lat * Math.PI / 180) || 1;
    const dLng = pt.lng + (radius * Math.sin(angle)) / cosLat;
    return [dLat, dLng];
}

function destroyDayMap() {
    if (dayMapInstance) {
        dayMapInstance.remove();
        dayMapInstance = null;
    }
    dayMapMarkers = [];
    dayMapDayId = null;

}

function createTripMap(el) {
    const map = L.map(el, {
        scrollWheelZoom: false,
        dragging: true,
        doubleClickZoom: true,
        touchZoom: true

    bindMapPinchGuard(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19
    }).addTo(map);
    return map;
}

        '<i class="fa-solid fa-diamond-turn-right"></i> 導航</a></div></div>';
}

function placeMarkers(map, entries) {
    const dupSeen = Object.create(null);
    const bounds = [];
    const byKey = Object.create(null);
    entries.forEach(entry => {
        const pt = entry.pt;
        if (typeof pt.lat !== 'number' || typeof pt.lng !== 'number') return;
        const coordKey = pt.lat.toFixed(6) + ',' + pt.lng.toFixed(6);
        const dupIndex = dupSeen[coordKey] || 0;
        dupSeen[coordKey] = dupIndex + 1;
        const displayLL = displayLatLng(pt, dupIndex);
        const icon = entry.kind === 'day'
            ? L.divIcon({
                className: '',
                html: '<div class="map-marker-day" style="background:' + entry.color + '">' + escapeHtml(entry.label) + '</div>',
                iconSize: [48, 22],
                iconAnchor: [24, 11],
                popupAnchor: [0, -12]
            })
            : L.divIcon({
                className: '',
                html: '<div class="map-marker-num">' + escapeHtml(entry.label) + '</div>',
                iconSize: [28, 28],
                iconAnchor: [14, 14],
                popupAnchor: [0, -14]
            });
        const marker = L.marker(displayLL, { icon }).addTo(map);
        const heading = entry.kind === 'day' ? { text: entry.label, color: entry.color } : null;
        marker.bindPopup(markerPopupHtml(pt, heading));
        if (entry.key != null) byKey[entry.key] = marker;
        bounds.push(displayLL);
    });
    if (bounds.length === 1) map.setView(bounds[0], 14);
    else if (bounds.length) map.fitBounds(bounds, { padding: [36, 36] });
    setTimeout(() => { if (map) map.invalidateSize(); }, 80);
    return byKey;
}

function initDayMap(dayId, points) {
    destroyDayMap();
    const el = document.getElementById('day-map-' + dayId);
    if (!el || typeof L === 'undefined') return;
    const withCoords = points.filter(p => typeof p.lat === 'number' && typeof p.lng === 'number');
    if (!withCoords.length) {
        el.innerHTML = '<div class="flex items-center justify-center h-full text-sm text-gray-500">暫無座標</div>';
        return;
    }
    dayMapInstance = createTripMap(el);
    dayMapDayId = dayId;
    const byKey = placeMarkers(dayMapInstance, points.map((pt, idx) => ({
        pt,
        label: String(idx + 1),
        kind: 'num',
        key: String(idx)
    })));
    dayMapMarkers = points.map((_, idx) => byKey[String(idx)] || null);
}

function initAllDaysMap() {
    destroyDayMap();
    const el = document.getElementById('day-map-ALL');
    if (!el || typeof L === 'undefined') return;
    const stops = [];
    ['D1', 'D2', 'D3', 'D4', 'D5'].forEach(day => {

        return;
    }
    dayMapInstance = createTripMap(el);
    dayMapDayId = 'ALL';
    allMapMarkers = placeMarkers(dayMapInstance, stops);
}

/**
 * One finger pans (Leaflet dragging). Double-click and double-tap zoom in
 * (doubleClickZoom, including Leaflet's touch dblclick fallback). Pinch stays
 * on touchZoom. Wheel scrolling is left to the page.
 */
function bindMapPinchGuard(map) {
    const el = map.getContainer();
    if (map.dragging && !map.dragging.enabled()) map.dragging.enable();
    if (map.doubleClickZoom && !map.doubleClickZoom.enabled()) map.doubleClickZoom.enable();
    if (map.touchZoom && !map.touchZoom.enabled()) map.touchZoom.enable();
    // Leaflet stops wheel events on the map even when scroll zoom is off.
    if (window.L && L.DomEvent && L.DomEvent.off && L.DomEvent.stopPropagation) {
        L.DomEvent.off(el, 'wheel', L.DomEvent.stopPropagation);
    }
    const stopPinchSteal = function (e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
    };
    el.addEventListener('touchmove', stopPinchSteal, { passive: false });
    // iOS may treat a pinch, especially zoom-out, as a page gesture and
    // cancel the map touch sequence. preventDefault keeps it on the map.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        el.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
    });
}

function focusMapMarker(map, marker, mapEl) {
    if (mapEl) mapEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (!marker || !map) return;
    const ll = marker.getLatLng();
    const z = Math.max(map.getZoom() || 13, 14);
    map.setView(ll, z);
    marker.openPopup();
    setTimeout(() => { if (map) map.invalidateSize(); }, 100);
}

        switchTab(day);
        setTimeout(open, 120);
    } else {
        open();
    }
}

    const pwd = document.getElementById('pwd-input').value;

function toHKD(ex) {
    return ex.currency === 'JPY' ? ex.amount * accData.rate : ex.amount;
}

function formatSplitLabel(splitUsers) {
    if (!splitUsers || splitUsers.length === accMembers.length) return '全部人';
    return splitUsers.join('、');
}

function expenseMatchesFilter(ex) {
    if (ex.deleted) return false;
    if (selectedFilterUser === '全部') return true;
    if (ex.payer === selectedFilterUser) return true;
    return (ex.splitUsers || []).includes(selectedFilterUser);
}

function activeExpenses() {
    return (accData.expenses || []).filter(ex => !ex.deleted);
}

function computeSettlement() {
    const balances = Object.fromEntries(accMembers.map(m => [m, 0]));
    const paid = Object.fromEntries(accMembers.map(m => [m, 0]));
    const consumed = Object.fromEntries(accMembers.map(m => [m, 0]));
    let totalHKD = 0;

    activeExpenses().forEach(ex => {
        const hkd = toHKD(ex);
        totalHKD += hkd;
        paid[ex.payer] += hkd;
        balances[ex.payer] += hkd;
        const users = (ex.splitUsers && ex.splitUsers.length) ? ex.splitUsers : accMembers;
        const share = hkd / users.length;
        users.forEach(m => {
            if (consumed[m] == null) return;
            consumed[m] += share;
            balances[m] -= share;
        });
    });

    const debtors = [];
    const creditors = [];
    accMembers.forEach(m => {
        const bal = balances[m];
        if (bal < -0.01) debtors.push({ name: m, amount: -bal });
        else if (bal > 0.01) creditors.push({ name: m, amount: bal });
    });
    debtors.sort((a, b) => b.amount - a.amount);
    creditors.sort((a, b) => b.amount - a.amount);

    const transfers = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
        const amt = Math.min(debtors[i].amount, creditors[j].amount);
        transfers.push({ from: debtors[i].name, to: creditors[j].name, amount: amt });
        debtors[i].amount -= amt;
        creditors[j].amount -= amt;
        if (debtors[i].amount < 0.01) i++;
        if (creditors[j].amount < 0.01) j++;
    }
    return { balances, paid, consumed, totalHKD, transfers };
}

function toggleSplitUser(user) {
    if (user === '全部') {
        selectedSplitUsers = [...accMembers];
    } else {
        if (selectedSplitUsers.length === accMembers.length) {
            // 由「全部」轉為只揀呢個
            selectedSplitUsers = [user];
        } else if (selectedSplitUsers.includes(user)) {
            selectedSplitUsers = selectedSplitUsers.filter(u => u !== user);
            if (!selectedSplitUsers.length) selectedSplitUsers = [user]; // 至少一人
        } else {
            selectedSplitUsers = [...selectedSplitUsers, user];
            if (selectedSplitUsers.length === accMembers.length) {
                // already all
            }
        }
    }
    updateSplitChipStyles();
}

        el.value = accData.rate;
        return;

    accData.rate = v;

}

function saveEditedExpense() {
    const id = document.getElementById('edit-id').value;
    const desc = document.getElementById('edit-desc').value.trim();
    const currency = document.getElementById('edit-currency').value;
    const amount = parseFloat(document.getElementById('edit-amount').value);
    if (!desc || isNaN(amount) || amount <= 0) {
        showConfirm('請輸入完整的項目名稱與有效金額！', null, '知道', '', true);
        return;
    }
    const idx = accData.expenses.findIndex(e => e.id === id);
    if (idx < 0) return;
    const oldEx = accData.expenses[idx];
    accData.expenses[idx] = normalizeExpense({
        id,
        desc,
        payer: tempEditPayer,
        splitUsers: tempEditSplitUsers,
        currency,
        amount,
        createdAt: oldEx.createdAt,
        updatedAt: nowTs(),
        deleted: !!oldEx.deleted
    });
    saveAccData('修改紀錄', `將 [${oldEx.desc} ${oldEx.currency}${oldEx.amount}] 改為 [${desc} ${currency}${amount}] (墊支:${tempEditPayer}, 分攤:${formatSplitLabel(tempEditSplitUsers)})`);
    closeEditModal();
}

function addExpense() {
    const desc = document.getElementById('acc-desc').value.trim();
    const currency = document.getElementById('acc-currency').value;
    const amount = parseFloat(document.getElementById('acc-amount').value);
    if (!desc || isNaN(amount) || amount <= 0) {
        showConfirm('請輸入完整的項目名稱與有效金額！', null, '知道', '', true);
        return;
    }
    if (!selectedSplitUsers.length) {
        showConfirm('請至少選擇一位分攤對象！', null, '知道', '', true);
        return;
    }
    const savedPayer = selectedPayer;
    const savedSplit = [...selectedSplitUsers];
    const loggedAt = nowTs();
    accData.expenses.push(normalizeExpense({
        id: genId(),
        desc,
        payer: savedPayer,
        splitUsers: savedSplit,
        currency,
        amount,
        createdAt: loggedAt,
        updatedAt: loggedAt
    }));
    selectedPayer = 'Wing';
    selectedSplitUsers = [...accMembers];
    document.getElementById('acc-desc').value = '';
    document.getElementById('acc-amount').value = '';
    saveAccData('新增紀錄', `新增: ${desc} - ${currency} ${amount} (墊支:${savedPayer}, 分攤:${formatSplitLabel(savedSplit)})`);
}

function requestDelete(id) {
    showConfirm('確定要刪除這筆紀錄嗎？', () => {
        showConfirm('唔好以為靜靜雞del撚咗就冇人知😏', () => executeDelete(id), '仍然刪除', '取消');
    });
}

function executeDelete(id) {
    const idx = accData.expenses.findIndex(e => e.id === id);
    if (idx < 0) return;
    const ex = accData.expenses[idx];
    // Soft-delete so sync merge won't resurrect the row from cloud.
    accData.expenses[idx] = normalizeExpense({
        ...ex,
        deleted: true,
        updatedAt: nowTs()
    });
    saveAccData('刪除紀錄', `刪除: ${ex.desc} (${ex.currency} ${ex.amount} 墊支:${ex.payer})`);
}

document.getElementById('nav-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.nav-tab');
    if (!btn) return;
    const tab = btn.getAttribute('data-tab');
    if (tab) switchTab(tab);
});

const APP_GATE_KEY = 'okTripUnlocked';
const APP_GATE_PASSWORD = '666666';

function isAppUnlocked() {
    return document.documentElement.classList.contains('app-unlocked');
}

function setGateError(show) {
    const err = document.getElementById('gate-error');
    if (!err) return;
    err.classList.toggle('is-on', !!show);
    err.style.display = show ? 'block' : 'none';
}

function hideAppGate() {
    document.documentElement.classList.add('app-unlocked');
    const gate = document.getElementById('app-gate');
    const app = document.getElementById('app-container');
    if (gate) gate.style.display = 'none';
    if (app) app.removeAttribute('inert');
}

function showAppGate() {
    document.documentElement.classList.remove('app-unlocked');
    const gate = document.getElementById('app-gate');
    const app = document.getElementById('app-container');
    if (app) app.setAttribute('inert', '');
    if (!gate) return;
    gate.style.display = 'flex';
    setGateError(false);
    const input = document.getElementById('gate-input');
    if (input) {
        input.value = '';
        setTimeout(() => input.focus(), 80);
    }
}

function submitAppGate() {
    const input = document.getElementById('gate-input');
    const pwd = (input && input.value ? input.value : '').trim();
    if (pwd === APP_GATE_PASSWORD) {
        try { localStorage.removeItem(APP_GATE_KEY); } catch (e) {}
        hideAppGate();
        bootApp();
    } else {
        setGateError(true);
        if (input) {
            input.value = '';
            input.focus();
        }
    }
}

let appBooted = false;
async function bootApp() {
    if (appBooted) return;
    appBooted = true;
    setSyncStatus(CLOUDFLARE_API_URL ? 'syncing' : 'local');
    await loadAccData();
    switchTab('ALL');
}

(async function init() {
    try { localStorage.removeItem(APP_GATE_KEY); } catch (e) {}
    showAppGate();
    window.addEventListener('pageshow', function (event) {
        try { localStorage.removeItem(APP_GATE_KEY); } catch (e) {}
        if (event.persisted) showAppGate();
    });
})();
</script>
