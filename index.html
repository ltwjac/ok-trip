function escapeHtml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function genId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'e_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}

function nowTs() { return Date.now(); }

/** Logged time in Hong Kong, e.g. 27/10 14:05. Falls back to updatedAt for older rows. */
function formatLoggedAt(ts) {
    const n = typeof ts === 'number' && isFinite(ts) ? ts : NaN;
    if (!isFinite(n)) return '';
    const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Hong_Kong',
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
    }).formatToParts(new Date(n));
    const pick = type => {
        const p = parts.find(x => x.type === type);
        return p ? p.value : '';
    };
    return pick('day') + '/' + pick('month') + ' ' + pick('hour') + ':' + pick('minute');
}

function normalizeExpense(ex) {
    if (!ex || typeof ex !== 'object') return null;
    let splitUsers;
    if (Array.isArray(ex.splitUsers) && ex.splitUsers.length) {
        splitUsers = ex.splitUsers.filter(u => accMembers.includes(u));
    } else if (ex.splitUser === '全部' || !ex.splitUser) {
        splitUsers = [...accMembers];
    } else if (accMembers.includes(ex.splitUser)) {
        splitUsers = [ex.splitUser];
    } else {
        splitUsers = [...accMembers];
    }
    if (!splitUsers.length) splitUsers = [...accMembers];
    const updatedAt = typeof ex.updatedAt === 'number' ? ex.updatedAt : nowTs();
    const createdAt = typeof ex.createdAt === 'number' ? ex.createdAt : updatedAt;
    return {
        id: ex.id || genId(),
        desc: String(ex.desc || ''),
        payer: accMembers.includes(ex.payer) ? ex.payer : accMembers[0],
        splitUsers,
        currency: ex.currency === 'HKD' ? 'HKD' : 'JPY',
        amount: Number(ex.amount) || 0,
        createdAt,
        updatedAt,
        deleted: !!ex.deleted
    };
}

function migrateAccData(raw) {
    const data = raw && typeof raw === 'object' ? raw : {};
    const expenses = Array.isArray(data.expenses) ? data.expenses.map(normalizeExpense).filter(Boolean) : [];
    return {
        rate: typeof data.rate === 'number' && data.rate > 0 ? data.rate : 0.052,
        expenses,
        auditLogs: Array.isArray(data.auditLogs) ? data.auditLogs : [],
        updatedAt: typeof data.updatedAt === 'number' ? data.updatedAt : 0
    };
}

function mergeExpenses(localList, cloudList) {
    const map = new Map();
    [...(localList || []), ...(cloudList || [])].forEach(ex => {
        const n = normalizeExpense(ex);
        if (!n) return;
        const prev = map.get(n.id);
        if (!prev || (n.updatedAt || 0) >= (prev.updatedAt || 0)) map.set(n.id, n);
    });
    return Array.from(map.values()).sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
}

function mergeAccData(local, cloud) {
    const L = migrateAccData(local);
    const C = migrateAccData(cloud);
    return {
        rate: (C.updatedAt || 0) >= (L.updatedAt || 0) ? C.rate : L.rate,
        expenses: mergeExpenses(L.expenses, C.expenses),
        auditLogs: mergeAudit(L.auditLogs, C.auditLogs),
        updatedAt: Math.max(L.updatedAt || 0, C.updatedAt || 0, nowTs())
    };
}

function mergeAudit(a, b) {
    const key = x => (x.timestamp || '') + '|' + (x.action || '') + '|' + (x.details || '');
    const map = new Map();
    [...(a || []), ...(b || [])].forEach(x => { if (x) map.set(key(x), x); });
    return Array.from(map.values()).slice(0, 200);
}

    else if (state === 'syncing') { el.textContent = '同步中…'; el.className = 'text-[10px] bg-blue-700 px-2 py-1 rounded-full shrink-0'; }
    else { el.textContent = '本地'; el.className = 'text-[10px] bg-blue-800/80 px-2 py-1 rounded-full shrink-0'; }
}

async function softHash(str) {
    const enc = new TextEncoder().encode('okinawa-audit:' + str);
    if (crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    // fallback：極弱 hash（仍只係阻嚇）
    let h = 0;
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return 'fallback_' + Math.abs(h).toString(16);
}

async function loadAccData() {
    // local first
    let localRaw = localStorage.getItem(STORAGE_KEY);
    if (!localRaw) {
        const legacy = localStorage.getItem(STORAGE_KEY_LEGACY);
        if (legacy) {
            try {
                accData = migrateAccData(JSON.parse(legacy));
                localStorage.setItem(STORAGE_KEY, JSON.stringify(accData));
            } catch (e) {
                accData = migrateAccData(null);
            }
        } else {
            accData = migrateAccData(null);
        }
    } else {
        try { accData = migrateAccData(JSON.parse(localRaw)); }
        catch (e) { accData = migrateAccData(null); }
    }

    if (!CLOUDFLARE_API_URL) {
        setSyncStatus('local');
        return;
    }

    setSyncStatus('syncing');
    try {
        const response = await fetch(CLOUDFLARE_API_URL);
        if (response.ok) {
            const cloudData = await response.json();
            accData = mergeAccData(accData, cloudData);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(accData));
            setSyncStatus('synced');
        } else {
            setSyncStatus('offline');
        }
    } catch (e) {
        console.warn('Cloudflare fetch failed', e);
        setSyncStatus('offline');
    }
}

async function saveAccData(logAction, logDetails, opts = {}) {
    if (!Array.isArray(accData.auditLogs)) accData.auditLogs = [];
    if (logAction) {
        accData.auditLogs.unshift({
            timestamp: new Date().toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' }),
            action: logAction,
            details: logDetails
        });
        if (accData.auditLogs.length > 200) accData.auditLogs.length = 200;
    }
    accData.updatedAt = nowTs();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(accData));

    if (CLOUDFLARE_API_URL) {
        setSyncStatus('syncing');
        try {
            // pull-merge-push to reduce overwrite risk
            let cloud = null;
            try {
                const r = await fetch(CLOUDFLARE_API_URL);
                if (r.ok) cloud = await r.json();
            } catch (_) {}
            if (cloud) accData = mergeAccData(accData, cloud);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(accData));
            await fetch(CLOUDFLARE_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(accData)
            });
            setSyncStatus('synced');
        } catch (e) {
            console.error('Failed to sync', e);
            setSyncStatus('offline');
        }
    } else {
        setSyncStatus('local');
    }

    if (!opts.skipRender && currentTab === 'ACCOUNTING') renderAccounting();
}

let dayMapInstance = null;
let dayMapMarkers = [];
let dayMapDayId = null;

/** Display-only spiral offset so stacked identical coords stay visible. */
function displayLatLng(pt, dupIndex) {
    if (!dupIndex) return [pt.lat, pt.lng];
    const angle = dupIndex * 2.399963229728653; // golden angle
    const radius = 0.00028 * dupIndex; // ~30m steps
    const dLat = pt.lat + radius * Math.cos(angle);
    const cosLat = Math.cos(pt.lat * Math.PI / 180) || 1;
    const dLng = pt.lng + (radius * Math.sin(angle)) / cosLat;
    return [dLat, dLng];
}

function destroyDayMap() {
    if (dayMapInstance) {
        dayMapInstance.remove();
        dayMapInstance = null;
    }
    dayMapMarkers = [];
    dayMapDayId = null;
}

function initDayMap(dayId, points) {
    destroyDayMap();
    const el = document.getElementById('day-map-' + dayId);
    if (!el || typeof L === 'undefined') return;
    const withCoords = points.filter(p => typeof p.lat === 'number' && typeof p.lng === 'number');
    if (!withCoords.length) {
        el.innerHTML = '<div class="flex items-center justify-center h-full text-sm text-gray-500">暫無座標</div>';
        return;
    }
    dayMapInstance = L.map(el, { scrollWheelZoom: false });
    dayMapDayId = dayId;
    dayMapMarkers = new Array(points.length).fill(null);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19
    }).addTo(dayMapInstance);

    const dupSeen = Object.create(null);
    const bounds = [];
    points.forEach((pt, idx) => {
        if (typeof pt.lat !== 'number' || typeof pt.lng !== 'number') return;
        const key = pt.lat.toFixed(6) + ',' + pt.lng.toFixed(6);
        const dupIndex = dupSeen[key] || 0;
        dupSeen[key] = dupIndex + 1;
        const n = idx + 1; // same as timeline blue badges (all stops incl. hotels)
        const icon = L.divIcon({
            className: '',
            html: '<div class="map-marker-num">' + n + '</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14],
            popupAnchor: [0, -14]
        });
        // True coords for Google Maps nav/search; offset only for marker display
        const nav = getDirectionsLink(pt.lat, pt.lng);
        const search = getGoogleSearchLink(pt);
        const popupHtml =
            '<div><div class="font-bold text-gray-800">' +
            (pt.time ? '<span style="color:#4f46e5">' + escapeHtml(pt.time) + '</span> ' : '') +
            escapeHtml(pt.title) +
            '</div><div class="map-popup-actions">' +
            '<a class="map-search-btn" href="' + search + '" target="_blank" rel="noopener noreferrer">' +
            '<i class="fa-solid fa-magnifying-glass"></i> Google 搜尋</a>' +
            '<a class="map-nav-btn" href="' + nav + '" target="_blank" rel="noopener noreferrer">' +
            '<i class="fa-solid fa-diamond-turn-right"></i> 導航到這裏</a></div></div>';
        const displayLL = displayLatLng(pt, dupIndex);
        const marker = L.marker(displayLL, { icon }).addTo(dayMapInstance);
        marker.bindPopup(popupHtml);
        dayMapMarkers[idx] = marker;
        bounds.push(displayLL);
    });
    if (bounds.length === 1) {
        dayMapInstance.setView(bounds[0], 14);
    } else {
        dayMapInstance.fitBounds(bounds, { padding: [36, 36] });
    }
    setTimeout(() => { if (dayMapInstance) dayMapInstance.invalidateSize(); }, 80);
}

function showStopOnMap(day, idx) {
    const open = () => {
        const mapEl = document.getElementById('day-map-' + day);
        if (mapEl) {
            mapEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        const marker = dayMapMarkers[idx];
        if (!marker || !dayMapInstance) return;
        const ll = marker.getLatLng();
        const z = Math.max(dayMapInstance.getZoom() || 13, 14);
        dayMapInstance.setView(ll, z);
        marker.openPopup();
        setTimeout(() => { if (dayMapInstance) dayMapInstance.invalidateSize(); }, 100);

function toHKD(ex) {
    return ex.currency === 'JPY' ? ex.amount * accData.rate : ex.amount;
}

function formatSplitLabel(splitUsers) {
    if (!splitUsers || splitUsers.length === accMembers.length) return '全部人';
    return splitUsers.join('、');
}

function expenseMatchesFilter(ex) {
    if (ex.deleted) return false;
    if (selectedFilterUser === '全部') return true;
    if (ex.payer === selectedFilterUser) return true;
    return (ex.splitUsers || []).includes(selectedFilterUser);
}

function activeExpenses() {
    return (accData.expenses || []).filter(ex => !ex.deleted);
}

function computeSettlement() {
    const balances = Object.fromEntries(accMembers.map(m => [m, 0]));
    const paid = Object.fromEntries(accMembers.map(m => [m, 0]));
    const consumed = Object.fromEntries(accMembers.map(m => [m, 0]));
    let totalHKD = 0;

    activeExpenses().forEach(ex => {
        const hkd = toHKD(ex);
        totalHKD += hkd;
        paid[ex.payer] += hkd;
        balances[ex.payer] += hkd;
        const users = (ex.splitUsers && ex.splitUsers.length) ? ex.splitUsers : accMembers;
        const share = hkd / users.length;
        users.forEach(m => {
            if (consumed[m] == null) return;
            consumed[m] += share;
            balances[m] -= share;
        });
    });

    const debtors = [];
    const creditors = [];
    accMembers.forEach(m => {
        const bal = balances[m];
        if (bal < -0.01) debtors.push({ name: m, amount: -bal });
        else if (bal > 0.01) creditors.push({ name: m, amount: bal });
    });
    debtors.sort((a, b) => b.amount - a.amount);
    creditors.sort((a, b) => b.amount - a.amount);

    const transfers = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
        const amt = Math.min(debtors[i].amount, creditors[j].amount);
        transfers.push({ from: debtors[i].name, to: creditors[j].name, amount: amt });
        debtors[i].amount -= amt;
        creditors[j].amount -= amt;
        if (debtors[i].amount < 0.01) i++;
        if (creditors[j].amount < 0.01) j++;
    }
    return { balances, paid, consumed, totalHKD, transfers };
}

                    <input type="number" id="acc-rate" inputmode="decimal" step="any" value="${accData.rate}" class="w-full p-2 border-2 border-gray-300 rounded font-bold focus:border-indigo-500 focus:outline-none bg-white">
                </div>
                <button type="button" onclick="saveRateFromInput()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold py-2 px-4 rounded-lg text-sm cursor-pointer">儲存匯率</button>
            </div>

            <div class="bg-gray-50 p-4 rounded-lg mb-6 border border-gray-200 shadow-inner">
                <h3 class="font-bold text-gray-800 mb-3 text-lg flex items-center"><i class="fa-solid fa-circle-plus mr-2 text-indigo-600"></i> 新增支出</h3>
                <div class="space-y-4 mb-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">支出項目：</label>
                        <input type="text" id="acc-desc" placeholder="輸入或下方選擇項目" class="p-2 border-2 border-gray-300 rounded focus:border-indigo-500 focus:outline-none w-full bg-white mb-2 text-base">
                        <div class="flex flex-wrap gap-1.5">
                            ${commonExpensePresets.map(preset => `
                                <button type="button" onclick="setPresetDesc('${escapeHtml(preset)}')" class="px-2.5 py-1 text-xs font-medium bg-white border border-gray-300 rounded hover:bg-gray-100 text-gray-700 cursor-pointer shadow-sm">${escapeHtml(preset)}</button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-green-50 p-3 rounded border border-green-200 shadow-sm">
                        <label class="block text-xs font-bold text-green-800 mb-2">誰人付款（墊支）：</label>
                        <div class="flex flex-wrap gap-2" id="payer-chips">
                            ${accMembers.map(m => `
                                <button type="button" data-payer-chip="${escapeHtml(m)}" onclick="selectPayer('${escapeHtml(m)}')" class="flex-1 min-w-[60px] py-2 px-1 text-sm font-bold rounded border-2 transition-colors cursor-pointer ${selectedPayer === m ? 'chip-on-green' : 'chip-off-green'}">${escapeHtml(m)}</button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-red-50 p-3 rounded border border-red-200 shadow-sm">
                        <label class="block text-xs font-bold text-red-800 mb-2">誰人享用（可多選分攤）：</label>
                        <div class="flex flex-col gap-2">
                            <button type="button" id="split-all-btn" onclick="toggleSplitUser('全部')" class="w-full py-2.5 px-2 text-sm font-bold rounded border-2 transition-colors cursor-pointer ${allSplitOn ? 'chip-on-red' : 'chip-off-red'}">全部人一齊 Share</button>
                            <div class="flex flex-wrap gap-2" id="split-chips">
                                ${accMembers.map(m => `
                                    <button type="button" data-split-chip="${escapeHtml(m)}" onclick="toggleSplitUser('${escapeHtml(m)}')" class="flex-1 min-w-[60px] py-2 px-1 text-sm font-bold rounded border-2 transition-colors cursor-pointer ${selectedSplitUsers.includes(m) ? 'chip-on-red' : 'chip-off-red'}">${escapeHtml(m)}</button>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2 pt-1">
                        <select id="acc-currency" class="p-3 border-2 border-gray-300 rounded font-bold focus:border-indigo-500 focus:outline-none w-1/3 bg-white text-base">
                            <option value="JPY">JPY ¥</option>
                            <option value="HKD">HKD $</option>
                        </select>
                        <input type="number" id="acc-amount" inputmode="decimal" step="any" placeholder="輸入金額" class="p-3 border-2 border-gray-300 rounded font-bold focus:border-indigo-500 focus:outline-none w-2/3 bg-white text-lg">
                    </div>
                </div>
                <button type="button" onclick="addExpense()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg py-3 rounded-lg transition-colors shadow-lg cursor-pointer flex justify-center items-center">
                    <i class="fa-solid fa-check mr-2"></i> 記錄支出
                </button>
            </div>

            <div class="bg-blue-50 p-4 rounded-lg mb-8 border-2 border-blue-100 shadow-sm">
                <h3 class="font-bold text-blue-900 mb-3 text-lg"><i class="fa-solid fa-scale-balanced mr-2"></i>自動結算報告</h3>
                <div class="flex justify-between mb-4 bg-white p-3 rounded shadow-sm border border-blue-50 items-center">
                    <span class="text-gray-600 font-bold">旅程總支出：</span>
                    <span class="font-bold text-blue-800 text-xl">HKD ${totalHKD.toFixed(1)}</span>
                </div>
                <div class="border-t-2 border-blue-200 pt-4 pb-4 mb-2">
                    <h4 class="font-bold text-gray-800 mb-2">各人財務明細（HKD）</h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm bg-white rounded shadow-sm border border-blue-100">
                            <thead>
                                <tr class="bg-blue-100/60 text-left text-xs text-blue-900">
                                    <th class="p-2">成員</th>
                                    <th class="p-2 text-right">已付</th>
                                    <th class="p-2 text-right">已用</th>
                                    <th class="p-2 text-right">淨額</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${accMembers.map(m => `
                                    <tr class="border-t border-blue-50">
                                        <td class="p-2 font-bold text-gray-800">${escapeHtml(m)}</td>
                                        <td class="p-2 text-right text-green-700">${paid[m].toFixed(1)}</td>
                                        <td class="p-2 text-right text-red-700">${consumed[m].toFixed(1)}</td>
                                        <td class="p-2 text-right font-black ${balances[m] >= 0 ? 'text-green-600' : 'text-red-600'}">
                                            ${balances[m] > 0 ? '收 +' : (balances[m] < 0 ? '付 ' : '平 ')}${balances[m].toFixed(1)}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="border-t-2 border-blue-200 pt-4">
                    <h4 class="font-bold text-gray-800 mb-3 bg-yellow-100 inline-block px-2 py-1 rounded">最終找數清單</h4>
                    ${transfers.map(t => `
                        <div class="flex items-center justify-between bg-green-50 p-3 rounded-lg border border-green-200 mb-2 shadow-sm">
                            <div class="font-bold text-gray-800">${escapeHtml(t.from)}</div>
                            <div class="flex flex-col items-center text-green-600 px-4">
                                <span class="text-[10px] bg-green-200 text-green-800 px-2 rounded-full mb-1">俾錢</span>
                                <i class="fa-solid fa-arrow-right"></i>
                                <span class="font-bold text-sm mt-1">HKD ${t.amount.toFixed(1)}</span>
                            </div>
                            <div class="font-bold text-gray-800">${escapeHtml(t.to)}</div>
                        </div>
                    `).join('') || '<div class="text-center text-gray-400 py-2">目前無欠款，大家都清晒！</div>'}
                </div>
            </div>

            <div class="mb-6 border-t border-gray-200 pt-6">
                <div class="flex flex-col gap-3 mb-4">
                    <h3 class="font-bold text-gray-800 text-lg"><i class="fa-solid fa-list-check mr-2 text-indigo-600"></i>歷史紀錄</h3>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" onclick="setFilterUser('全部')" class="px-3 py-1.5 text-xs font-bold rounded-full border-2 cursor-pointer ${selectedFilterUser === '全部' ? 'chip-on-indigo' : 'chip-off-indigo'}">全部</button>
                        ${accMembers.map(m => `
                            <button type="button" onclick="setFilterUser('${escapeHtml(m)}')" class="px-3 py-1.5 text-xs font-bold rounded-full border-2 cursor-pointer ${selectedFilterUser === m ? 'chip-on-indigo' : 'chip-off-indigo'}">${escapeHtml(m)}</button>
                        `).join('')}
                    </div>
                </div>
                <div class="space-y-2">${expensesHtml}</div>
            </div>
        </div>`;
}

function openEditModal(id) {
    const ex = accData.expenses.find(e => e.id === id);
    if (!ex) return;
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-desc').value = ex.desc;
    document.getElementById('edit-currency').value = ex.currency;
    document.getElementById('edit-amount').value = ex.amount;
    tempEditPayer = ex.payer;
    tempEditSplitUsers = [...(ex.splitUsers || accMembers)];
    renderEditModalButtons();
    document.getElementById('edit-modal').style.display = 'flex';
}

function renderEditModalButtons() {
    const payerContainer = document.getElementById('edit-payer-buttons');
    payerContainer.innerHTML = accMembers.map(m => `
        <button type="button" onclick="setEditPayer('${escapeHtml(m)}')" class="flex-1 min-w-[60px] py-2 text-sm font-bold rounded border-2 cursor-pointer ${tempEditPayer === m ? 'chip-on-green' : 'chip-off-green'}">${escapeHtml(m)}</button>
    `).join('');

    const allOn = tempEditSplitUsers.length === accMembers.length;
    const splitContainer = document.getElementById('edit-split-buttons');
    splitContainer.innerHTML = `
        <button type="button" onclick="setEditSplitAll()" class="w-full py-2 text-sm font-bold rounded border-2 cursor-pointer ${allOn ? 'chip-on-red' : 'chip-off-red'}">全部人一齊 Share</button>
        <div class="flex flex-wrap gap-2">
            ${accMembers.map(m => `
                <button type="button" onclick="toggleEditSplit('${escapeHtml(m)}')" class="flex-1 min-w-[60px] py-2 text-sm font-bold rounded border-2 cursor-pointer ${tempEditSplitUsers.includes(m) ? 'chip-on-red' : 'chip-off-red'}">${escapeHtml(m)}</button>
            `).join('')}
        </div>`;
}

function setEditPayer(m) { tempEditPayer = m; renderEditModalButtons(); }
function setEditSplitAll() { tempEditSplitUsers = [...accMembers]; renderEditModalButtons(); }
function toggleEditSplit(user) {
    if (tempEditSplitUsers.length === accMembers.length) {
        tempEditSplitUsers = [user];
    } else if (tempEditSplitUsers.includes(user)) {
        tempEditSplitUsers = tempEditSplitUsers.filter(u => u !== user);
        if (!tempEditSplitUsers.length) tempEditSplitUsers = [user];
    } else {
        tempEditSplitUsers = [...tempEditSplitUsers, user];
    }
    renderEditModalButtons();
}
function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

function confirmSaveEditedExpense() {
    showConfirm('確定要儲存修改嗎？', () => saveEditedExpense());
}

function saveEditedExpense() {
    const id = document.getElementById('edit-id').value;
    const desc = document.getElementById('edit-desc').value.trim();
    const currency = document.getElementById('edit-currency').value;
    const amount = parseFloat(document.getElementById('edit-amount').value);
    if (!desc || isNaN(amount) || amount <= 0) {
        showConfirm('請輸入完整的項目名稱與有效金額！', null, '知道', '', true);
        return;
    }
    const idx = accData.expenses.findIndex(e => e.id === id);
    if (idx < 0) return;
    const oldEx = accData.expenses[idx];
    accData.expenses[idx] = normalizeExpense({
        id,
        desc,
        payer: tempEditPayer,
        splitUsers: tempEditSplitUsers,
        currency,
        amount,
        createdAt: oldEx.createdAt,
        updatedAt: nowTs(),
        deleted: !!oldEx.deleted
    });
    saveAccData('修改紀錄', `將 [${oldEx.desc} ${oldEx.currency}${oldEx.amount}] 改為 [${desc} ${currency}${amount}] (墊支:${tempEditPayer}, 分攤:${formatSplitLabel(tempEditSplitUsers)})`);
    closeEditModal();
}

function addExpense() {
    const desc = document.getElementById('acc-desc').value.trim();
    const currency = document.getElementById('acc-currency').value;
    const amount = parseFloat(document.getElementById('acc-amount').value);
    if (!desc || isNaN(amount) || amount <= 0) {
        showConfirm('請輸入完整的項目名稱與有效金額！', null, '知道', '', true);
        return;
    }
    if (!selectedSplitUsers.length) {
        showConfirm('請至少揀一位分攤對象！', null, '知道', '', true);
        return;
    }
    const savedPayer = selectedPayer;
    const savedSplit = [...selectedSplitUsers];
    const loggedAt = nowTs();
    accData.expenses.push(normalizeExpense({
        id: genId(),
        desc,
        payer: savedPayer,
        splitUsers: savedSplit,
        currency,
        amount,
        createdAt: loggedAt,
        updatedAt: loggedAt
    }));
    selectedPayer = 'Wing';
    selectedSplitUsers = [...accMembers];
    document.getElementById('acc-desc').value = '';
    document.getElementById('acc-amount').value = '';
    saveAccData('新增紀錄', `新增: ${desc} - ${currency} ${amount} (墊支:${savedPayer}, 分攤:${formatSplitLabel(savedSplit)})`);
}

function requestDelete(id) {
    showConfirm('確定要刪除這筆紀錄嗎？', () => {
        showConfirm('唔好以為靜靜雞delete左無人知😏', () => executeDelete(id), '仍然刪除', '取消');
    });
}

function executeDelete(id) {
    const idx = accData.expenses.findIndex(e => e.id === id);
    if (idx < 0) return;
    const ex = accData.expenses[idx];
    // Soft-delete so sync merge won't resurrect the row from cloud.
    accData.expenses[idx] = normalizeExpense({
        ...ex,
        deleted: true,
        updatedAt: nowTs()
    });
    saveAccData('刪除紀錄', `刪除: ${ex.desc} (${ex.currency} ${ex.amount} 墊支:${ex.payer})`);
}

document.getElementById('nav-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.nav-tab');
    if (!btn) return;
    const tab = btn.getAttribute('data-tab');
    if (tab) switchTab(tab);
});

const APP_GATE_KEY = 'okTripUnlocked';
const APP_GATE_PASSWORD = '666666';

function isAppUnlocked() {
    try { return localStorage.getItem(APP_GATE_KEY) === '1'; } catch (e) { return false; }
}

function hideAppGate() {
    const gate = document.getElementById('app-gate');
    if (gate) gate.style.display = 'none';
}

function showAppGate() {
    const gate = document.getElementById('app-gate');
    if (!gate) return;
    gate.style.display = 'flex';
    const err = document.getElementById('gate-error');
    const input = document.getElementById('gate-input');
    if (err) err.classList.add('hidden');
    if (input) {
        input.value = '';
        setTimeout(() => input.focus(), 80);
    }
}

function submitAppGate() {
    const input = document.getElementById('gate-input');
    const err = document.getElementById('gate-error');
    const pwd = (input && input.value ? input.value : '').trim();
    if (pwd === APP_GATE_PASSWORD) {
        try { localStorage.setItem(APP_GATE_KEY, '1'); } catch (e) {}
        hideAppGate();
        bootApp();
    } else {
        if (err) err.classList.remove('hidden');
        if (input) {
            input.value = '';
            input.focus();
        }
    }
}

let appBooted = false;
async function bootApp() {
    if (appBooted) return;
    appBooted = true;
    setSyncStatus(CLOUDFLARE_API_URL ? 'syncing' : 'local');
    await loadAccData();
    switchTab('ALL');
}

(async function init() {
    if (isAppUnlocked()) {
        hideAppGate();
        await bootApp();
    } else {
        showAppGate();
    }
})();
</script>
